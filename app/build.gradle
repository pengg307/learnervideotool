plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.aigenerator.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.aigenerator.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // ============ READ FROM local.properties ============
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file("local.properties")
        if (localPropertiesFile.exists()) {
            localProperties.load(new FileInputStream(localPropertiesFile))
        }
        
        def agnesApiKey = localProperties.getProperty("agnes.api.key", "")
        def agnesImageModel = localProperties.getProperty("agnes.image.model", "agnes-image-2.0-flash")
        def agnesVideoModel = localProperties.getProperty("agnes.video.model", "agnes-video-v2.0")
        def agnesVideoWidth = localProperties.getProperty("agnes.video.width", "1152").toInteger()
        def agnesVideoHeight = localProperties.getProperty("agnes.video.height", "768").toInteger()
        def agnesVideoFrames = localProperties.getProperty("agnes.video.frames", "121").toInteger()
        def agnesVideoFps = localProperties.getProperty("agnes.video.fps", "24").toInteger()
        
        buildConfigField "String", "AGNES_API_KEY", "\"$agnesApiKey\""
        buildConfigField "String", "AGNES_IMAGE_MODEL", "\"$agnesImageModel\""
        buildConfigField "String", "AGNES_VIDEO_MODEL", "\"$agnesVideoModel\""
        buildConfigField "Int", "AGNES_VIDEO_WIDTH", "$agnesVideoWidth"
        buildConfigField "Int", "AGNES_VIDEO_HEIGHT", "$agnesVideoHeight"
        buildConfigField "Int", "AGNES_VIDEO_FRAMES", "$agnesVideoFrames"
        buildConfigField "Int", "AGNES_VIDEO_FPS", "$agnesVideoFps"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.0'
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.navigation:navigation-compose:2.7.6'
    implementation 'androidx.hilt:hilt-navigation-compose:1.1.0'
    
    implementation 'com.google.dagger:hilt-android:2.48'
    kapt 'com.google.dagger:hilt-compiler:2.48'
    
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'androidx.datastore:datastore-preferences:1.0.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    
    implementation 'com.google.accompanist:accompanist-permissions:0.32.0'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}