name: Build Android APK

on:
  push:
    branches: [ main, master, remote1 ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          echo "JAR size: $(ls -lh gradle/wrapper/gradle-wrapper.jar)"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIGenerator-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Show APK info
        if: success()
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      # ============ NEW: Upload to Appetize.io for browser testing ============
      - name: Upload APK to Appetize.io
        if: success()
        uses: ychescale9/action-appetize@v1
        with:
          app-path: app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.APPETIZE_TOKEN }}
          public: true
          # Optional: specify device (default is pixel4)
          # device: pixel4

      - name: Display Appetize.io Link
        if: success()
        run: |
          echo "=================================================="
          echo "📱 Your app is ready to test in your browser!"
          echo "🔗 Click the link above or check the previous step for the URL"
          echo "=================================================="