name: Build Android APK

on:
  push:
    branches: [ main, master, remote4 ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          echo "JAR size: $(ls -lh gradle/wrapper/gradle-wrapper.jar)"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIGenerator-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Show APK info
        if: success()
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK to Appetize.io
        if: success()
        run: |
          echo "📤 Uploading APK to Appetize.io..."
          
          RESPONSE=$(curl -s -X POST "https://api.appetize.io/v1/apps" \
            -H "X-API-KEY: ${{ secrets.APPETIZE_TOKEN }}" \
            -F "file=@app/build/outputs/apk/debug/app-debug.apk" \
            -F "platform=android")
          
          echo "📦 Response: $RESPONSE"
          
          # Extract the publicURL (correct field name)
          PUBLIC_URL=$(echo "$RESPONSE" | grep -o '"publicURL":"[^"]*"' | cut -d'"' -f4)
          
          if [ -n "$PUBLIC_URL" ]; then
            echo "✅ Upload successful!"
            echo "=================================================="
            echo "📱 App URL: $PUBLIC_URL"
            echo "=================================================="
            echo "APPETIZE_URL=$PUBLIC_URL" >> $GITHUB_ENV
          else
            echo "❌ Could not extract publicURL from response"
            echo "Response was: $RESPONSE"
            exit 1
          fi

      - name: Display Appetize.io Link
        if: success()
        run: |
          echo "=================================================="
          echo "📱 Your app is ready to test in your browser!"
          echo "🔗 ${{ env.APPETIZE_URL }}"
          echo "=================================================="