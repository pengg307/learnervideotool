name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1 ── Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2 ── Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3 ── Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4 ── Fix: download the real gradle-wrapper.jar
      #        (the jar is a binary that cannot be stored as plain text)
      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          echo "gradle-wrapper.jar downloaded: $(ls -lh gradle/wrapper/gradle-wrapper.jar)"

      # 5 ── Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 6 ── Cache Gradle dependencies
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 7 ── Build
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --info
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g -XX:MaxMetaspaceSize=512m"

      # 8 ── Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIGenerator-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 9 ── Print size
      - name: Build summary
        run: |
          echo "Build complete!"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
